<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Log in | Bandcast</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="auth-page">
    <header>
      <a class="brand-link" href="index.html" aria-label="Bandcast home">
        <h1 aria-label="Bandcast">
          <span class="brand-blue" aria-hidden="true">B</span>
          <span class="brand-yellow" aria-hidden="true">A</span>
          <span class="brand-red" aria-hidden="true">N</span>
          <span class="brand-green" aria-hidden="true">D</span>
          <span class="brand-blue" aria-hidden="true">C</span>
          <span class="brand-red" aria-hidden="true">A</span>
          <span class="brand-yellow" aria-hidden="true">S</span>
          <span class="brand-blue" aria-hidden="true">T</span>
        </h1>
      </a>
    </header>
    <main class="auth-main">
      <div class="auth-form">
        <h1>Log in</h1>
        <label>
          Username
          <input type="text" name="username" autocomplete="username" required />
        </label>
        <label>
          Password
          <input
            type="password"
            name="password"
            autocomplete="current-password"
            required
          />
        </label>
        <button type="button">Log in</button>
        <p class="auth-switch">
          Don't have an account? <a href="signup.html">Sign up</a>
        </p>
      </div>
    </main>
  </body>
</html>
